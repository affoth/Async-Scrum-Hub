name: Deploy demo to GitHub Pages

on:
  workflow_dispatch: {} # MANUAL ONLY — deploy from the Actions tab (push never deploys)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:demo # base is auto-derived from GITHUB_REPOSITORY
      - uses: actions/configure-pages@v5 # auto-enables Pages with the Actions source
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist # 'uses' steps ignore working-directory → full path

  deploy:
    needs: build # only publishes if the build succeeded
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # live URL appears here
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
